<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>報告班長 — 決斷連 mock v5</title>
<style>
  /* ── 跟隨系統：色彩（light/dark）、字級（Dynamic Type / Android 字型大小）、動態、對比 ── */
  :root{
    color-scheme:light dark;
    --khaki:#E3DFD0;--ink:#1B1D1A;--olive:#4A5733;--olive2:#39452A;--signal:#B3261E;
    --mute:#6F715F;--line:#C9C4B2;--card:#F2EFE4;--white:#FFFFFF;--memeText:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root{--khaki:#171813;--ink:#ECEAE0;--olive:#5E6E42;--olive2:#3F4B2E;--signal:#B8332B;
          --mute:#9A9C8C;--line:#2E3027;--card:#22241D;--white:#F3F1E8;--memeText:#F3F1E8}
  }
  @media (prefers-contrast:more){:root{--mute:var(--ink);--line:var(--ink)}}
  html{font-size:100%}                         /* 讓 rem 跟著系統字級走（Android / 桌面） */
  @supports (font:-apple-system-body){html{font:-apple-system-body}} /* iOS Dynamic Type */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--khaki);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;font-size:1rem;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .mockbar{font-size:.75rem;color:var(--mute);display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
  .mockbar b{color:var(--ink);font-weight:500}

  main{flex:1;display:flex;flex-direction:column;max-width:440px;width:100%;margin:0 auto;padding:0 18px}
  .screen{display:none;flex-direction:column;gap:14px;flex:1}
  .screen.on{display:flex}
  @media (prefers-reduced-motion:no-preference){.screen.on{animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}

  .officer{display:flex;align-items:flex-end;gap:12px;padding-top:12px}
  .officer .av{width:5.75rem;height:5.75rem;flex:none;cursor:pointer;border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .officer .av svg{width:100%;height:100%;display:block}
  .plate{flex:1;min-width:0}
  .plate .rank{display:inline-block;font-size:.75rem;letter-spacing:.14em;color:var(--khaki);background:var(--ink);padding:3px 8px;border-radius:3px}
  .plate .name{font-size:1.25rem;font-weight:800;margin-top:6px;line-height:1.1}
  .plate .meta{font-size:.75rem;color:var(--mute);margin-top:4px}
  .plate .tap{font-size:.7rem;color:var(--mute);margin-top:6px}
  .topnav{display:flex;justify-content:flex-end}
  .topnav button{font:inherit;font-size:.8rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}

  .bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:1.05rem;line-height:1.5;font-weight:600}
  .bubble:before{content:"";position:absolute;left:28px;top:-9px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  .bubble small{display:block;font-weight:400;font-size:.8rem;color:var(--mute);margin-top:6px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:5.5rem}
  .tile b{font-size:2rem;font-weight:800;line-height:1}
  .tile span{font-size:.75rem;color:var(--mute)}
  .minor{display:flex;gap:8px;flex-wrap:wrap}
  .minor button{font:inherit;font-size:.875rem;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
  .hint{font-size:.75rem;color:var(--mute);line-height:1.5}

  .lab{font-size:.8rem;color:var(--mute);margin-top:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:inherit;font-size:.95rem;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--khaki);border-color:var(--ink)}
  .stars{display:flex;gap:6px}
  .stars button{font:inherit;font-size:1.9rem;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:4px}
  .stars button.lit{color:var(--ink)}

  /* 梗圖卡 — 兩欄：左欄文字、右欄角色。角色永遠不壓字。 */
  .meme{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--olive);color:var(--memeText);display:grid;grid-template-columns:1fr 38%;grid-template-rows:1fr;padding:16px;padding-top:34px;gap:8px}
  .meme.red{background:var(--signal)}
  .meme.ok{background:var(--olive2)}
  .meme .txt{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .meme .cap{font-weight:900;line-height:1.2;text-align:left;overflow-wrap:anywhere;text-shadow:0 0 2px #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
  .meme .top{font-size:clamp(1rem,1.3rem,1.5rem)}
  .meme .big{font-size:clamp(1.8rem,2.6rem,3rem);letter-spacing:-.01em}
  .meme .bot{font-size:clamp(.95rem,1.1rem,1.3rem)}
  .meme .face{align-self:end;width:100%;aspect-ratio:1;opacity:.97}
  .meme .face svg{width:100%;height:100%}
  .meme .num{font-size:clamp(4rem,6.5rem,7rem);line-height:1;font-weight:900;text-align:left;text-shadow:3px 3px 0 #000}
  .meme .tag{position:absolute;left:14px;top:12px;font-size:.7rem;letter-spacing:.12em;opacity:.85}
  .steps{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:1.05rem;line-height:1.55}
  .steps p+p{margin-top:4px}
  .steps p:before{content:"▸ ";color:var(--olive)}

  /* 新兵日記 */
  .day{border-top:1px solid var(--line);padding:10px 0}
  .day h4{font-size:.8rem;color:var(--mute);font-weight:500;margin-bottom:6px}
  .ent{display:grid;grid-template-columns:3.2rem 1fr auto;gap:8px;font-size:.95rem;padding:5px 0;align-items:baseline}
  .ent time{color:var(--mute);font-variant-numeric:tabular-nums}
  .ent .o{font-weight:600}
  .ent .r{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .ent .r.ok{background:var(--olive);color:var(--white);border-color:var(--olive)}
  .ent .r.bad{background:var(--signal);color:var(--white);border-color:var(--signal)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
  .stat span{font-size:.7rem;color:var(--mute)}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding:8px 0 18px}
  .btn{font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--ink);color:var(--khaki);border:0;border-radius:6px;padding:16px 20px;flex:1;min-width:8.75rem}
  .btn.line{background:none;color:var(--ink);border:1px solid var(--ink);flex:0 0 auto}
  .btn.ghost{background:none;color:var(--mute);flex:0 0 auto;padding:16px 6px;font-weight:500}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .back{align-self:flex-start;font:inherit;font-size:.875rem;color:var(--mute);background:none;border:0;cursor:pointer;padding:6px 0 0}
  footer{padding:0 18px 16px;font-size:.75rem;color:var(--mute);display:flex;justify-content:space-between;max-width:440px;width:100%;margin:0 auto}
</style>
</head>
<body>

<div class="mockbar"><b>mock 控制</b> 台北・信義區 · 週四 12:40 <span style="margin-left:auto">v5 · 角色圖不壓字 · 點頭像換班長 · 切系統深色／字級看變化</span></div>

<main>

  <section class="screen on" id="home">
    <div class="topnav"><button onclick="showDiary()">新兵日記</button></div>
    <div class="officer">
      <div class="av" onclick="cycle()" id="avHome"></div>
      <div class="plate"><span class="rank" id="rkHome"></span><div class="name" id="nmHome"></div><div class="meta">決斷連 · 入伍第 12 天 · 饅頭剩 ∞ 顆</div><div class="tap">點頭像換班長</div></div>
    </div>
    <div class="bubble" id="bubHome"></div>
    <div class="grid">
      <button class="tile" onclick="intake('eat')"><b>吃</b><span>中午、晚上，吃什麼</span></button>
      <button class="tile" onclick="intake('go')"><b>去</b><span>下班後、週末，去哪</span></button>
      <button class="tile" onclick="intake('attend')"><b>赴</b><span>那個場合，去不去</span></button>
      <button class="tile" onclick="intake('rest')"><b>歇</b><span>現在，去哪喝一杯</span></button>
    </div>
    <div class="minor">
      <button onclick="intake('sleep')">幾點睡</button>
      <button onclick="intake('reply')">這訊息現在回嗎</button>
      <button onclick="intake('buy')">買不買</button>
    </div>
    <p class="hint">大事不受理。班長只管小事，大事你自己去找連長。</p>
  </section>

  <section class="screen" id="intake">
    <button class="back" onclick="show('home')">← 回報告</button>
    <div class="officer"><div class="av" id="avIn"></div><div class="plate"><span class="rank" id="rkIn"></span><div class="name" id="nmIn"></div></div></div>
    <div class="bubble" id="bubIn"></div>
    <div id="inBody"></div>
    <div class="row"><button class="btn" onclick="order()">是！班長</button></div>
  </section>

  <section class="screen" id="cmd">
    <div class="meme" id="memeCmd">
      <span class="tag">決斷連 · 一個口令一個動作</span>
      <div class="txt"><div class="cap top" id="mTop"></div><div class="cap big" id="mBig"></div><div class="cap bot" id="mBot"></div></div>
      <div class="face" id="faceCmd"></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="row">
      <button class="btn" onclick="done()">報告班長，完成</button>
      <button class="btn line" onclick="reissue()" id="reissue">店關了</button>
      <button class="btn ghost" onclick="stand()">沒做</button>
    </div>
  </section>

  <section class="screen" id="log">
    <div class="meme ok">
      <span class="tag">莒光日 · 榮譽榜</span>
      <div class="txt"><div class="cap top">登記</div><div class="cap big" style="font-size:clamp(1.5rem,2rem,2.4rem)" id="logBody"></div><div class="cap bot">雄壯！威武！</div></div>
      <div class="face" id="faceLog"></div>
    </div>
    <div class="row"><button class="btn" onclick="show('home')">解散</button><button class="btn line" onclick="alert('mock：正式版呼叫系統分享（IG / LINE）')">分享梗圖</button></div>
  </section>

  <section class="screen" id="stand">
    <div class="meme red">
      <span class="tag">決斷連 · 違紀登記</span>
      <div class="txt"><div class="cap top" id="standBark"></div><div class="num" id="sec">20</div><div class="cap bot" id="standTxt"></div></div>
      <div class="face" id="faceStand"></div>
    </div>
  </section>

  <!-- 新兵日記 -->
  <section class="screen" id="diary">
    <button class="back" onclick="show('home')">← 回報告</button>
    <div class="officer"><div class="av" id="avDiary"></div><div class="plate"><span class="rank">新兵日記</span><div class="name">本週 09/08 – 09/14</div><div class="meta">每一道口令自動登記。不用寫，班長替你寫。</div></div></div>
    <div class="stats" id="stats"></div>
    <div id="days"></div>
    <div class="row"><button class="btn" onclick="showWeekly()">看本週莒光園地</button></div>
  </section>

  <!-- 莒光園地週報 -->
  <section class="screen" id="weekly">
    <button class="back" onclick="showDiary()">← 回日記</button>
    <div class="meme ok" style="aspect-ratio:auto;grid-template-columns:1fr;gap:12px">
      <span class="tag">莒光園地 · 第 2 週 · 週日 20:00 發布</span>
      <div class="txt" style="gap:10px">
        <div class="cap top">本週講評</div>
        <div id="wkBody" style="font-size:1rem;line-height:1.6;font-weight:600;text-shadow:0 0 2px #000,1px 1px 0 #000"></div>
        <div class="cap bot" id="wkVerdict"></div>
      </div>
      <div class="face" id="faceWk" style="width:38%;justify-self:end"></div>
    </div>
    <div class="row"><button class="btn line" onclick="alert('mock：正式版呼叫系統分享')">分享週報</button><button class="btn" onclick="show('home')">解散</button></div>
  </section>

</main>
<footer><span>班長有什麼了不起？— 你小學當的那個不算。</span><span>連續服從 5 天</span></footer>

<script>
/* ── 三位班長。原創角色，向量繪製；正式版可整套替換成繪師 PNG（規格見開發文件） ──
   avatar(lv, mood)  mood: idle | bark | praise | punish */
var RANKS=[
  {rank:"菜鳥班長",name:"阿良",hello:"報、報告什麼事？班長…我是說，你各位啊。"},
  {rank:"值星班長",name:"黑面",hello:"你各位啊！報告什麼事？<small>合理的要求是訓練，不合理的要求是磨練。</small>"},
  {rank:"士官長",name:"老郭",hello:"你各位給我站好。要報告什麼，三秒內講完。<small>我看過的菜鳥比你吃過的饅頭多。</small>"}
];
function avatar(lv,mood,onDark){
  mood=mood||"idle";
  var skin=["#EFC9A6","#D9A87C","#C98F62"][lv], shade=["#D9AE8B","#BF8C62","#A9734C"][lv];
  var cap="#4A5733",capD="#33402A",ink="#1F1F1C",gold="#D4AF37";
  var bg=onDark?"none":"url(#bgG)";
  var s='<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F3E8"/><stop offset="1" stop-color="#E7E2D0"/></linearGradient>';
  s+='<radialGradient id="capG" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#5B6A3F"/><stop offset="1" stop-color="'+capD+'"/></radialGradient></defs>';
  s+='<rect width="120" height="120" fill="'+bg+'"/>';
  /* 身體：制服＋領口＋名牌 */
  s+='<path d="M14 122 C22 92 42 86 60 86 C78 86 98 92 106 122 Z" fill="url(#capG)"/>';
  s+='<path d="M48 86 L60 100 L72 86 L66 84 L60 92 L54 84 Z" fill="'+shade+'"/>';
  s+='<rect x="70" y="98" width="18" height="6" rx="1" fill="#F1EBD8"/><rect x="72" y="100" width="14" height="2" fill="'+ink+'" opacity=".55"/>';
  if(lv===1) s+='<path d="M24 122 L70 84 L78 90 L34 122 Z" fill="#C0392B"/><path d="M26 122 L72 86" stroke="#F1D36A" stroke-width="1.5"/>'; /* 值星帶 */
  if(lv===2) s+='<path d="M60 92 v12" stroke="#9A9A9A" stroke-width="1.6"/><rect x="54" y="104" width="12" height="7" rx="2" fill="'+gold+'"/><circle cx="66" cy="107" r="1.6" fill="#7A6314"/>'; /* 哨子 */
  /* 頸 */
  s+='<rect x="50" y="72" width="20" height="16" fill="'+shade+'"/>';
  /* 耳 */
  s+='<ellipse cx="34" cy="60" rx="5" ry="7" fill="'+skin+'"/><ellipse cx="86" cy="60" rx="5" ry="7" fill="'+skin+'"/>';
  /* 頭 */
  s+='<path d="M60 20 C40 20 34 38 35 56 C36 74 46 84 60 84 C74 84 84 74 85 56 C86 38 80 20 60 20 Z" fill="'+skin+'"/>';
  s+='<path d="M38 60 C42 78 52 84 60 84 C68 84 78 78 82 60 C80 76 70 82 60 82 C50 82 40 76 38 60 Z" fill="'+shade+'" opacity=".55"/>';
  /* 帽：船形軍帽＋帽徽 */
  var tilt=lv===0?' transform="rotate(-7 60 36)"':'';
  s+='<g'+tilt+'><path d="M30 42 C36 22 84 22 90 42 L86 44 C74 34 46 34 34 44 Z" fill="url(#capG)"/>';
  s+='<path d="M28 42 L92 42 L90 50 C74 46 46 46 30 50 Z" fill="'+capD+'"/>';
  s+='<circle cx="60" cy="33" r="4.5" fill="'+gold+'"/><path d="M60 29.5 l1.2 2.5 2.8 .3 -2 1.9 .5 2.8 -2.5 -1.3 -2.5 1.3 .5 -2.8 -2 -1.9 2.8 -.3 Z" fill="#7A6314"/></g>';
  if(lv===2) s+='<path d="M42 48 q18 -6 36 0" stroke="#8C8C8C" stroke-width="1" fill="none"/>'; /* 白髮線 */
  /* 眉 */
  var brow={idle:[0,0],bark:[-3,3],praise:[-2,-2],punish:[-4,4]}[mood];
  if(lv===0) s+='<path d="M42 '+(52+brow[0])+' q7 -4 14 0 M64 '+(52+brow[0])+' q7 -4 14 0" stroke="'+ink+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  else s+='<path d="M40 '+(50+brow[0])+' L56 '+(54+brow[1])+' M80 '+(50+brow[0])+' L64 '+(54+brow[1])+'" stroke="'+ink+'" stroke-width="'+(lv===2?4.5:3.8)+'" fill="none" stroke-linecap="round"/>';
  /* 眼 */
  if(lv===2){ s+='<path d="M38 60 h18 a3 3 0 0 1 3 3 v4 a3 3 0 0 1 -3 3 h-14 a4 4 0 0 1 -4 -4 Z M64 60 h18 v6 a4 4 0 0 1 -4 4 h-14 a3 3 0 0 1 -3 -3 v-4 a3 3 0 0 1 3 -3 Z" fill="'+ink+'"/><path d="M59 62 h2" stroke="'+ink+'" stroke-width="2"/><path d="M42 62 l6 6" stroke="#fff" stroke-width="1.5" opacity=".5"/>'; }
  else if(lv===0){ s+='<circle cx="49" cy="62" r="4.2" fill="#fff"/><circle cx="71" cy="62" r="4.2" fill="#fff"/><circle cx="49.5" cy="62.5" r="2.6" fill="'+ink+'"/><circle cx="71.5" cy="62.5" r="2.6" fill="'+ink+'"/><circle cx="50.5" cy="61.5" r=".9" fill="#fff"/><circle cx="72.5" cy="61.5" r=".9" fill="#fff"/>'; }
  else { s+='<path d="M43 62 h12 v3.5 h-12 Z M65 62 h12 v3.5 h-12 Z" fill="'+ink+'"/>'; }
  /* 法令紋（士官長） */
  if(lv===2) s+='<path d="M50 70 q-2 6 0 10 M70 70 q2 6 0 10" stroke="'+shade+'" stroke-width="1.6" fill="none"/>';
  /* 嘴 */
  var m={
    idle: lv===0?'<path d="M52 75 q8 -3 16 0" stroke="'+ink+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>':'<path d="M50 75 h20" stroke="'+ink+'" stroke-width="3" stroke-linecap="round"/>',
    bark:'<path d="M50 72 q10 -4 20 0 q-2 10 -10 10 q-8 0 -10 -10 Z" fill="'+ink+'"/><path d="M53 73 q7 -2 14 0" stroke="#fff" stroke-width="1.6"/>',
    praise:'<path d="M50 74 q10 8 20 0" stroke="'+ink+'" stroke-width="3" fill="none" stroke-linecap="round"/>',
    punish:'<path d="M48 71 q12 -6 24 0 q-1 12 -12 12 q-11 0 -12 -12 Z" fill="'+ink+'"/><path d="M51 72 q9 -3 18 0" stroke="#fff" stroke-width="1.8"/><path d="M54 80 q6 3 12 0" stroke="#C0392B" stroke-width="2" fill="none"/>'
  }[mood];
  s+=m;
  if(lv===0&&(mood==="idle"||mood==="bark")) s+='<path d="M88 48 q5 7 0 10 q-5 -3 0 -10 Z" fill="#5DADE2"/>'; /* 冒汗 */
  if(mood==="punish"){ s+='<path d="M22 40 l6 -8 M18 52 l8 -2 M98 40 l-6 -8 M102 52 l-8 -2" stroke="'+(onDark?"#fff":ink)+'" stroke-width="2.5" stroke-linecap="round"/>'; }
  if(mood==="praise"){ s+='<path d="M20 30 l4 4 M26 24 l1 6 M100 30 l-4 4 M94 24 l-1 6" stroke="'+gold+'" stroke-width="2.2" stroke-linecap="round"/>'; }
  return s+'</svg>';
}

var LV=1, CUR=null, CHOICE={}, STARS=4;
var MOD={
