<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>決斷連 · 像素班長</title><style>
:root{color-scheme:light dark;--bg:#E3DFD0;--ink:#1B1D1A;--card:#F5F2E8;--line:#b6b8a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1160px;margin:auto;padding:40px 24px}a{color:inherit}h1{font-size:clamp(32px,6vw,64px);letter-spacing:-.05em;margin:10px 0}p{max-width:720px}button,.download{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#4A5733;color:white;border-color:#4A5733}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.table{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}.row{display:grid;grid-template-columns:100px repeat(5,minmax(120px,1fr));min-width:820px;border-bottom:1px solid var(--line);padding:16px;align-items:center;gap:8px}.row:last-child{border:0}.row img{width:var(--px,144px);height:var(--px,144px);object-fit:contain;image-rendering:pixelated;max-width:100%}.cell{text-align:center;background-image:conic-gradient(#80808010 25%,transparent 0 50%,#80808010 0 75%,transparent 0);background-size:16px 16px}.cell a{display:block;font-size:12px}h2{font-size:24px;margin-top:40px}.sil{display:flex;gap:40px;background:#F5F2E8;padding:24px;width:fit-content;border-radius:10px}.sil img{width:48px;height:48px;filter:brightness(0);image-rendering:pixelated}.meta{font-size:13px;opacity:.7}body.dark{--bg:#171813;--ink:#F1EFE5;--card:#24271F;--line:#535744}@media(prefers-color-scheme:dark){body:not(.light){--bg:#171813;--ink:#F1EFE5;--card:#24271F;--line:#535744}}button:focus-visible,a:focus-visible{outline:3px solid #D4AF37;outline-offset:3px}
</style><main><a href="../index.html">← 回到設計總覽</a><p class="meta">決斷連 ／ 角色資產</p><h1>三位班長，<br>十五種脾氣。</h1><p>同一張骨架，只換表情。48×48 原生格線、共同膚色、三段制服亮度；金環帽徽與右肩左斜的值星帶。</p><nav><button data-size="48">原寸 48px</button><button data-size="144" aria-pressed="true">放大 3×</button><button id="theme">切換深淺色</button><a class="download" href="../officers-8bit.zip" download>下載 15 張 PNG＋WebP</a><a class="download" href="README.md">製作與查證紀錄</a></nav><div class="table" id="table"><div class="row"><strong>班長</strong><span>待命 idle</span><span>下令 bark</span><span>認可 praise</span><span>罰站 punish</span><span>放過 soft</span></div></div><h2>原寸剪影</h2><div class="sil" id="sil"></div><p class="meta">三人各有五表情。每張 7–8 個不透明色，PNG 與 WebP 可見像素相同。第五種 soft 已交圖，產品端尚未接入。</p><p>真人文化辨識尚待執行：<a href="blind-test.html">開啟 2 秒盲測頁</a>。請交給五名當過兵的人，各自觀看並記錄原始回答。</p></main><script>
const moods=['idle','bark','praise','punish','soft'];const names=['阿良','黑面','老郭'];const titles=['菜鳥班長','值星班長','士官長'];for(let i=0;i<3;i++){let row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${names[i]}</b><br><small>${titles[i]}</small></div>`+moods.map(m=>`<div class="cell"><img src="public/officers/${i}/${m}.png" alt="${names[i]} ${m}"><a download href="public/officers/${i}/${m}.webp">WebP ↗</a></div>`).join('');document.querySelector('#table').append(row);let im=document.createElement('img');im.src=`public/officers/${i}/idle.png`;im.alt=`${names[i]}剪影`;document.querySelector('#sil').append(im)}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--px',b.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#theme').onclick=()=>{const dark=getComputedStyle(document.body).getPropertyValue('--bg').trim()==='#171813';document.body.className=dark?'light':'dark'};
</script></html>
