<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖像辨識測試</title><style>body{font:18px/1.6 system-ui;max-width:600px;margin:60px auto;padding:24px;color:#1b1d1a;background:#f5f2e8}button,input{font:inherit;padding:12px;border:1px solid #999;border-radius:8px}button{cursor:pointer;background:#e3dfd0}#images{height:100px;display:flex;align-items:center;gap:36px}img{width:48px;height:48px;image-rendering:pixelated}#images.hidden img{visibility:hidden}input{width:100%;box-sizing:border-box}p{margin:24px 0}small{display:block;margin:24px 0}button:disabled{opacity:.4}</style><h1>圖像辨識測試</h1><p id="status">第 1 位，共 5 位。請由當過兵的受測者獨立作答。</p><p>按下開始後會顯示三張圖，兩秒後隱藏。請勿事先透露產品名稱或設計背景。</p><button id="start">開始觀看</button><div id="images" class="hidden"></div><form hidden id="form"><label for="answer">你認為這是哪一國的兵？</label><p><input id="answer" required autocomplete="off"></p><button>記錄並換下一位</button></form><button id="download" hidden>下載五份原始回答</button><small>資料只留在本頁記憶體，重新整理會清除。每人使用原寸 48px、觀看 2 秒；請勿調整瀏覽器縮放。此頁不自動評分。</small><script>const records=[];const ims=document.querySelector('#images');for(const n of [2,0,1]){const im=new Image(48,48);im.src=`public/officers/${n}/idle.png`;im.alt='';ims.append(im)}document.querySelector('#start').onclick=async()=>{await Promise.all([...ims.querySelectorAll('img')].map(im=>im.decode()));document.querySelector('#start').disabled=true;ims.className='';setTimeout(()=>{ims.className='hidden';document.querySelector('#form').hidden=false;document.querySelector('#answer').focus()},2000)};document.querySelector('#form').onsubmit=e=>{e.preventDefault();records.push({participant:records.length+1,answer:document.querySelector('#answer').value.trim(),viewSeconds:2,size:48});document.querySelector('#answer').value='';document.querySelector('#form').hidden=true;if(records.length===5){document.querySelector('#start').hidden=true;document.querySelector('#status').textContent='五份回答已記錄。請下載保存。';document.querySelector('#download').hidden=false}else{document.querySelector('#status').textContent=`第 ${records.length+1} 位，共 5 位。`;document.querySelector('#start').disabled=false}};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='blind-test-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
